<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracking Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container {
            margin-top: 50px;
            animation: fadeIn 1.5s ease-in-out;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .chart-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
        }
        .progress {
            background: #e9ecef;
            height: 30px;
            border-radius: 15px;
            margin-top: 10px;
        }
        .progress-bar {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            font-weight: bold;
            line-height: 30px;
            border-radius: 15px;
            animation: growBar 1.5s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes growBar {
            from {
                width: 0;
            }
            to {
                width: 75%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Progress Tracking Dashboard</h1>
            <p>Visualize your fitness journey with interactive insights</p>
        </div>

        <div class="chart-container">
            <h3>Calorie Breakdown</h3>
            <canvas id="caloriePieChart" width="50" height="100"></canvas>
        </div>

        <div class="chart-container">
            <h3>Weight Trends</h3>
            <canvas id="weightLineChart" width="400" height="200"></canvas>
        </div>

        <div class="chart-container">
            <h3>Workout Adherence</h3>
            <div class="progress">
                <div class="progress-bar" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
            </div>
        </div>

        <div class="chart-container">
            <h3>Activity Breakdown</h3>
            <canvas id="activityBarChart" width="400" height="200"></canvas>
        </div>
    </div>

    <script>
        // Calorie Pie Chart
        const calorieCtx = document.getElementById('caloriePieChart').getContext('2d');
        new Chart(calorieCtx, {
            type: 'pie',
            data: {
                labels: ['Protein', 'Carbs', 'Fats'],
                datasets: [{
                    data: [40, 35, 25],
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'],
                    hoverOffset: 10
                }]
            },
            options: {
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                    }
                }
            }
        });

        // Weight Line Chart
        const weightCtx = document.getElementById('weightLineChart').getContext('2d');
        new Chart(weightCtx, {
            type: 'line',
            data: {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [{
                    label: 'Weight (kg)',
                    data: [70, 69, 68, 67],
                    borderColor: '#36A2EB',
                    borderWidth: 2,
                    pointBackgroundColor: '#FF6384',
                    pointRadius: 5,
                    pointHoverRadius: 7,
                    fill: true,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)'
                }]
            },
            options: {
                plugins: {
                    tooltip: {
                        enabled: true,
                        callbacks: {
                            label: function(context) {
                                return ${context.dataset.label}: ${context.raw} kg;
                            }
                        }
                    }
                }
            }
        });

        // Activity Bar Chart
        const activityCtx = document.getElementById('activityBarChart').getContext('2d');
        new Chart(activityCtx, {
            type: 'bar',
            data: {
                labels: ['Yoga', 'Cardio', 'Strength Training', 'Running'],
                datasets: [{
                    label: 'Hours Spent',
                    data: [5, 10, 7, 3],
                    backgroundColor: ['#74C69D', '#FFB703', '#8ECAE6', '#FF6D6D'],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return ${context.label}: ${context.raw} hours;
                            }
                        }
                    }
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
